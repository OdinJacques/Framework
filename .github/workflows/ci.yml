name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changelog-check:
    # Only meaningful on a PR (needs a base ref to diff against); a direct
    # push to main has already merged, so there's nothing left to gate.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          # actions/checkout defaults to GitHub's synthetic test-merge commit
          # for pull_request events (refs/pull/<PR>/merge), whose commit
          # message is auto-generated — checking that out instead of the
          # PR's real head is what the [skip-changelog] marker needs to find.
          ref: ${{ github.event.pull_request.head.sha }}
          # Full history, needed to compute a reliable merge-base for the
          # diff below. Accepted trade-off: cost grows with repo history
          # size; revisit with a bounded depth + fallback if this job ever
          # becomes slow enough to matter.
          fetch-depth: 0
      - name: Check for a docs/changes/ entry
        run: |
          if ! git fetch origin "${{ github.base_ref }}"; then
            echo "::error::Failed to fetch base branch '${{ github.base_ref }}'. This looks like a transient CI/network issue, not a missing changelog entry — re-run the job."
            exit 1
          fi

          HEAD_MSG=$(git log -1 --format=%B)
          if echo "$HEAD_MSG" | grep -qF '[skip-changelog]'; then
            echo "Skipping: [skip-changelog] found in the latest commit message."
            exit 0
          fi

          CHANGED_FILES=$(git diff --name-only "origin/${{ github.base_ref }}...HEAD")

          RELEVANT_FILES=$(echo "$CHANGED_FILES" | grep -vE '^(package-lock\.json|\.gitignore|\.prettierignore)$|^docs/changes/' || true)
          if [ -z "$RELEVANT_FILES" ]; then
            echo "No changelog-relevant files changed. Skipping."
            exit 0
          fi

          NEW_ENTRY=$(echo "$CHANGED_FILES" | grep -E '^docs/changes/.+\.md$' | grep -v '^docs/changes/README\.md$' || true)
          if [ -n "$NEW_ENTRY" ]; then
            echo "Found a docs/changes/ entry: $NEW_ENTRY"
            exit 0
          fi

          {
          cat <<'MSG'
          ## Missing changelog entry

          This PR changes code/config but doesn't include a new file under `docs/changes/`.

          This repo tracks non-trivial changes in a lightweight change log so future contributors
          (human or AI) can understand past decisions without digging through git history.

          **To fix this:**

          1. Create a new file: `docs/changes/YYYY-MM-DD-short-kebab-slug.md`
             (e.g. `docs/changes/2026-07-27-fix-login-timeout.md`)
          2. Use this template:

             ```markdown
             # <Short title>

             **Date:** YYYY-MM-DD

             ## Summary
             What changed and why, in a few sentences.

             ## Files changed
             - `path/to/file.ts` (around line N-M at the time of this change): what changed there and why

             ## Rationale
             (if not obvious from Summary) — why this approach over alternatives.
             ```

          Full rules and more examples: `docs/changes/README.md`

          **Is this change genuinely trivial** (typo, formatting, a one-line tweak)? Add
          `[skip-changelog]` to your latest commit message and push again to skip this check.

          <details><summary>Changed files in this PR</summary>
          MSG
          echo "$CHANGED_FILES" | sed 's/^/- /'
          echo ""
          echo "</details>"
          } | tee -a "$GITHUB_STEP_SUMMARY"

          exit 1

  lint-and-typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck

  web:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:web
        env:
          WEB_BASE_URL: https://automationexercise.com
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: web-playwright-report
          path: apps/web/playwright-report/
          retention-days: 7

  api:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run test:api
        env:
          API_BASE_URL: https://automationexercise.com/api/
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: api-playwright-report
          path: apps/api/playwright-report/
          retention-days: 7

  sql:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run test:sql
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sql-test-results
          path: apps/sql/test-results/
          retention-days: 7
